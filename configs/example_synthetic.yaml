# End-to-end smoke run against data/synthetic/make.py output.
run:
  name: synthetic_demo
  output_dir: outputs
  seed: 7
  gates: open
  n_jobs: 4

data:
  path: data/synthetic/modeling.parquet
  target: y
  id_cols: [row_id]
  missing_values: [-9999]
  split:
    mode: column
    column: split

features:
  base_prefix: old_
  new_prefix: new_

feature_selection:
  sample_size: 20000
  chunk_size: 3
  spearman:
    target_min_abs: 0.01
    redundancy_max_abs: 0.95
  mutual_info:
    redundancy_max: 0.85

model:
  task: regression
  num_boost_round: 300
  early_stopping_rounds: 30
  variants: [base, base_plus_new, leave_one_in]

analysis:
  shap:
    sample_size: 5000
