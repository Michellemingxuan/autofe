# Demo run: UCI Taiwanese Bankruptcy Prediction (dataset 572).
# Scenario - the incumbent model uses profitability / leverage / growth ratios;
# the cash-flow family is the newly proposed feature set under evaluation.
#
#   run data/bankruptcy/prepare.ipynb    -> the fixed splits and few-shot rows
#   autofe -c configs/bankruptcy.yaml
#   autofe -c configs/bankruptcy.yaml --set discovery.enabled=true

run:
  name: bankruptcy_cashflow
  output_dir: outputs
  seed: 42
  gates: open         # open    -> measure everything, remove nothing (development view)
                      # enforce -> gates filter, for running the pipeline automatically
  n_jobs: -1
  backend: loky
  log_level: INFO

data:
  # The fixed 60 / 20 / 20 split, stratified on the target and written once by
  # data/bankruptcy/prepare.ipynb. The pipeline reads it as is and never re-splits.
  paths:
    train: data/bankruptcy/train.csv
    valid: data/bankruptcy/valid.csv
    test:  data/bankruptcy/test.csv
  target: bankrupt
  id_cols: [row_id]
  missing_values: []          # this source has no sentinel codes
  missing_indicators:       # add a 0/1 column recording where a feature was missing
    enabled: false          # enable when missingness itself may carry signal
    scope: candidates       # candidates | all
    min_missing_rate: 0.01  # skip columns barely ever missing
    suffix: _is_missing
    treat_as: new           # new | source - which feature list the indicators join

features:
  # base is left empty: everything numeric that is not a candidate, id or target
  # becomes the incumbent set (84 ratios).
  base: []
  new:
    - cash_flow_rate
    - cash_flow_per_share
    - cash_reinvestment_pct
    - cash_total_assets
    - cash_current_liability
    - cash_turnover_rate
    - cash_flow_to_sales
    - cash_flow_to_total_assets
    - cash_flow_to_liability
    - cfo_to_assets
    - cash_flow_to_equity
    - cand_dup_roa_c          # planted: near-copy of an incumbent
    - cand_noise              # planted: pure noise

# ---------------------------------------------------------------------------
# Feature discovery. Off by default: the run then evaluates exactly the
# candidates declared in `features.new` above, which is the original scenario.
#
# Turn it on and an LLM proposes further candidates over the incumbent set,
# screens them on a small sample, and APPENDS the survivors to `features.new` -
# so one run judges the declared batch and the proposed one side by side, at the
# same four gates.
#
#   autofe -c configs/bankruptcy.yaml --set discovery.enabled=true
#
# Needs OPENAI_API_KEY in the environment or a .env at or above the working
# directory. The two planted controls double as a check on the screens: a
# proposal as redundant as cand_dup_roa_c should be rejected, and one as
# uninformative as cand_noise should score near zero.
# ---------------------------------------------------------------------------
discovery:
  enabled: false
  strategy: caafe          # caafe | elfgym | ferg | featllm | promptfe
  task_description: >
    Financial statement data for Taiwanese companies collected from the Taiwan
    Economic Journal between 1999 and 2009. Each row is one company-year, with
    ratios covering profitability, leverage, liquidity, cash flow, turnover and
    growth. The task is to predict bankruptcy, declared according to Taiwan
    Stock Exchange business regulations. Bankruptcies are rare, about 3% of rows.

  # A round asks for a batch and screens each block in turn, folding every
  # outcome into the history the next round sees.
  batch_size: 5
  max_rounds: 2            # the stopping control; 1 is a single batch

  # The rows the screen fits each proposal on (a sample of train) and scores it
  # on (a sample of valid), written by prepare.ipynb in the same format as the
  # splits. Balanced, because a uniform draw at a 3% base rate would be almost
  # all solvent companies. `screen_data: splits` uses the whole splits instead.
  screen_data: files       # splits | files
  screen_paths:
    train: data/bankruptcy/screen_train.csv
    valid: data/bankruptcy/screen_valid.csv
  screen_boost_rounds: 150
  metric: adj_gini

  # The example rows shown under each column - the only concrete data the
  # proposer ever sees of the table. Precomputed by prepare.ipynb: chosen per
  # class by KMeans on train, one row per cluster, so the 32 do not land in
  # whichever region happens to be dense and both classes appear even at a low
  # base rate. Round r shows batch r, so a second round reasons from new rows.
  few_shot_path: data/bankruptcy/few_shot.csv

  # Every proposal across runs, with its verdict and the reason, read back into
  # the next run's prompt so it does not repeat an idea already judged. Round
  # numbers and the rotation through the few-shot batches continue from it.
  # Delete the file to start a fresh study.
  history_path: outputs/discovery_history/bankruptcy.csv

  # What each column means. Written by prepare.ipynb from the archive's own
  # headers: a proposer that only knows a column by name cannot bring any
  # real-world knowledge to it.
  column_descriptions_path: data/bankruptcy/column_descriptions.json

  llm:
    backend: openai
    model: gpt-4o
    reasoning_effort: null # gpt-4o rejects this parameter with a 400

data_quality:
  enabled: true               # period stability (by_col) is still the unported check
  max_missing_rate: 0.95
  min_unique: 2
  max_psi: 0.25             # distribution shift a feature may not exceed
  distribution_check: true  # compare each variable's distribution across the splits
  distribution_reference: train
  distribution_bins: 10               # catches net_income_flag, which is constant
  drop_failed: true

feature_selection:
  enabled: true
  sample_size: null           # 6.8k rows - use all of train
  on_split: train
  chunk_size: 4
  spearman:
    enabled: true
    target_min_abs: 0.04      # ~3 sigma for n=4.1k train rows
    redundancy_max_abs: 0.90
  mutual_info:
    enabled: true
    bins: 20
    target_method: histogram
    target_min: 0.0
    redundancy_max: 0.80
    pairwise_against: all

model:
  task: binary
  num_boost_round: 400
  early_stopping_rounds: 40
  verbose_eval: 0
  save_models: true
  variants:
    - base
    - base_plus_new
    - leave_one_in
  tuning:
    enabled: false          # false = use model.params as given, no search
    mode: shared            # shared -> tune on `tune_on`, reuse for variant
                            # per_variant -> tune each variant separately
    tune_on: base_plus_new  # which variant is tuned when mode=shared
    n_trials: 20
    metric: adj_gini        # scored on the valid split; test is never touched
    seed: null              # defaults to run.seed
    search_space: {}        # empty -> DEFAULT_SEARCH_SPACE in stages/modeling.py

  params:
    eta: 0.05
    max_depth: 4
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 1.0   # keep at 1.0: with it below 1 the column COUNT moves
                            # the score, so base and leave_one_in differ by an
                            # offset that has nothing to do with the feature
    eval_metric: auc

analysis:
  metrics_on: [train, valid, test]
  capture_rate_percents: [0.01, 0.05, 0.10]   # all written to metrics_by_variant_split.csv
  comparison_capture_percents: [0.05]         # which of them reach the comparison table
  accuracy_bins: 10
  include_accuracy: True   # decile calibration, not classification accuracy;
  baseline_variant: base
  shap:
    enabled: true
    sample_size: 5000
    on_split: test

verdict:              # the decision protocol: four gates, then a call on the batch
  enabled: true
  gini_split: test          # split the gini gain is judged on
  min_gini_gain: 0.005      # below this, the feature did not move the model
  require_valid_too: true   # the gain has to hold on valid as well
  max_shap_rank_pct: 0.5    # must land in the top half by mean |SHAP|
  shap_variant: base_plus_new
