# synthetic_agent - a CDSS-shaped synthetic use case for building the agent.
#
#   PYTHONPATH=src python -m agent.synthetic data/synthetic_agent   # writes the data
#   PYTHONPATH=src python -m agent.cli -c configs/synthetic_agent.yaml \
#       -d "use payment behaviour relative to spend" -k 5
#
# Planted: default risk depends on the share of the last 90 days' spend paid
# back (no base column has it), and defaulters carry collections spends dated
# after their as-of date - a leak the point-in-time linkage must stop.

run:
  name: synthetic_agent
  output_dir: outputs
  seed: 42
  n_jobs: 1

data:
  paths:
    train: data/synthetic_agent/train.csv
    valid: data/synthetic_agent/valid.csv
    test:  data/synthetic_agent/test.csv     # out of time: the latest months
  target: default
  id_cols: [id]
  id_format: "<customer_id>_<dt>_<marker>; dt is the as-of date as YYYYMMDD; customer_id joins to the sources' customer_id"

features:
  base: []

discovery:
  task_description: "Find features that add predictive information on default to the incumbent model, measured by Gini gain."
  task_context_path: data/synthetic_agent/task_context.md
  screen_data: files
  screen_paths:
    train: data/synthetic_agent/screen_train.csv
    valid: data/synthetic_agent/screen_valid.csv
  screen_boost_rounds: 150
  metric: adj_gini
  column_descriptions_path: data/synthetic_agent/column_descriptions.json
  few_shot_path: data/synthetic_agent/few_shot.csv
  additional_data:
    dir: data/synthetic_agent/additional_data
    linkage_dir: data/synthetic_agent/linkage
    scopes:
      CAS:
        glob: "*_flagged.csv"
        sql_dialect: BigQuery
    target_cases:                             # scored at inference (Evaluate > Inference results)
      dir: data/synthetic_agent/additional_data/targeted_cases   # the names below are in it
      rows: transactions.csv                  # their rows, shaped like the model data
      # Each additional dataset's history for the cases: its own file name in dir
      # (spends.parquet ...), unless `sources: {name: path}` says otherwise.
      id_template: "{customer_id}_{trans_dt:%Y%m%d}_{marker}"   # the model id, from their columns
      case_column: customer_id
      time_column: trans_dt
      flag_top: 0.05                          # each model flags its top 5% of test scores

agent:
  engine: pandas              # the synthetic case is small: pandas, no Spark needed
  linkage_engine: pandas
  max_intents: 5
  min_gini_gain: 0.0          # analyst gates on the screen; min_capture_gain: off unless set
  run_dir: outputs/agent
  checks:                                   # the cheap checks before the screen's fit
    same_values: 0.99                       # C0: refuse a feature this rank-correlated with an earlier one
    same_meaning: 0.6                       # C0: this close in words to an earlier one -> must say what differs (null: off)
    max_model_rho: 0.9                      # C1: max |Spearman rho| with a model column above this -> redundant (null: off)
    keep_if_residual_rho: 0.05              # C1's exception: fitted anyway when |rho residual| reaches this
    min_variable_gini: null                 # C2: the feature's own Gini on y - information only; a number makes it a gate
  llm:
    backend: openai
    model: gpt-4.1
  models: [gpt-4.1, gpt-4.1-mini, gpt-5]     # offered per run in the UI

feature_selection:
  enabled: true
  spearman:
    redundancy_max_abs: 0.80

model:
  task: binary
  num_boost_round: 300
  early_stopping_rounds: 30
  threads_per_model: 4
  variants: [base, leave_one_in]
  params:
    eta: 0.05
    max_depth: 3
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 1.0
    eval_metric: auc
    tree_method: hist

verdict:
  gini_split: test
  require_valid_too: false
