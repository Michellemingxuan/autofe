# cdss_us_sbs - internal use case, run in the private environment; kept here as
# the template for a dataset that arrives already split upstream.
#
#   1. open data/cdss_us_sbs/prepare.ipynb, point it at the three extracts, and
#      use its profile to fill in the TODOs below (target, id_cols, candidates)
#   2. run it to the end -> the three tables, column descriptions, few-shot rows
#   3. autofe -c configs/cdss_us_sbs.yaml
#      (add --set discovery.enabled=true once discovery.task_description is written)

run:
  name: cdss_us_sbs
  output_dir: outputs
  seed: 42
  n_jobs: 1
  backend: loky
  log_level: INFO
  gates: enforce           # open | enforce - measure everything, remove nothing, while we learn the data

data:
  paths:                # prepare.ipynb writes these; the pipeline reads them as given
    train: data/cdss_us_sbs/train.csv
    valid: data/cdss_us_sbs/valid.csv
    test:  data/cdss_us_sbs/test.csv
  target: default
  id_cols: [cust_id_new]           # e.g. [acct_id, as_of_date] - enables the leakage check
  # TODO: how cust_id_new is built - the agent writes every point-in-time join from it.
  id_format: "TODO: e.g. <customer_id>_<dt>; dt is the as-of date as YYYYMMDD; customer_id joins to the sources' customer_id"
  missing_values: [-9999]
  missing_indicators:       # add a 0/1 column recording where a feature was missing
    enabled: false          # enable when missingness itself may carry signal
    scope: candidates       # candidates | all
    min_missing_rate: 0.01  # skip columns barely ever missing
    suffix: _is_missing
    treat_as: new           # new | source - which feature list the indicators join
  weight_col: null

features:
  base: []              # empty = every other numeric column
  new: []               # list the candidates, or use new_prefix
  new_prefix: null
  exclude: []           # non-numeric columns the pipeline should ignore

# ---------------------------------------------------------------------------
# Feature discovery. Off until the task description is written: it is the
# proposer's only briefing on what the data is.
# ---------------------------------------------------------------------------
discovery:
  enabled: true
  strategy: caafe          # caafe | elfgym | ferg | featllm | promptfe
  task_description: "Generate novel, economically and behaviorally meaningful features for the US CDSS SBS model that provide incremental predictive information for customer default risk and improve model discrimination, as measured by Gini gain (positively related to AUC) and gain in capture rate."     
  task_context_path: data/cdss_us_sbs/task_context.md
  additional_data:
    # The agent: each source is <name>.parquet (or .csv, or a parquet folder)
    # beside <name>_data_sample.json, the {column: [description, [sample values]]}
    # file; a sample JSON alone is listed as schema only.
    dir: data/cdss_us_sbs/additional_data
    linkage_dir: data/cdss_us_sbs/linkage     # one confirmed join per source, written on approval
    # Where data requests may pull from, by keyword. A request within a scope is
    # SQL over its tables; one outside every scope is "beyond scope". Add a scope
    # as another keyword with its own variable lists.
    scopes:
      CAS:
        glob: "*_flagged.csv"                 # its variable lists in dir
        sql_dialect: BigQuery
        description: ""                       # TODO: what CAS holds, in a sentence, for the agent
    
    # The discovery pipeline: lists these schemas in its prompt when enabled.
    enabled: false
    name: "spends_and_payments"
    description: "Spend and payment behavior samples of a single customer, used to design features that can be aligned to each transaction without temporal leakage."
    schema_paths:
      - data/cdss_us_sbs/spends_data_sample.json
      - data/cdss_us_sbs/payments_data_sample.json

  batch_size: 5
  max_rounds: 10
  screen_data: files       # splits | files - files: the samples prepare.ipynb draws
  screen_paths:            # the screen fits on train's sample, scores on valid's
    train: data/cdss_us_sbs/screen_train.csv
    valid: data/cdss_us_sbs/screen_valid.csv
  screen_boost_rounds: 150
  metric: adj_gini
  categorical_columns: ['atopymti', 'bdglblen', 'colaind', 'crprlind', 'delinqi1', 'pysncrti', 'ceons30r', 'reonsdra', 'smsbncin', 'spltrcin', 'stllwpmt', 'penapr'] # TODO: the real measurements (or list categorical_columns)
  column_descriptions_path: data/cdss_us_sbs/column_descriptions.json   # prepare.ipynb
  few_shot_path: data/cdss_us_sbs/few_shot.csv                          # prepare.ipynb
  history_path: outputs/discovery_history/cdss_us_sbs.csv   # every proposal + verdict, fed back
  llm:
    backend: safechain        # openai | safechain
    model: gpt-5
    reasoning_effort: null

# ---------------------------------------------------------------------------
# The model agent (python -m agent.server -c configs/cdss_us_sbs.yaml): what
# only the agent uses. The data it works on is above: the id format under data;
# the screen rows, descriptions, shots, task context and additional data
# (sources, linkage, CAS scope) under discovery.
# ---------------------------------------------------------------------------
agent:
  engine: pandas                            # features, by default - each run may choose spark
  linkage_engine: pandas                    # spark if an extract does not fit in memory (slower otherwise)
  spark_conf:                               # the local SparkSession each script starts
    spark.driver.memory: 16g                # TODO: about half the machine's RAM
    spark.sql.shuffle.partitions: "64"
  max_intents: 5                            # K: the results a direction aims for
  min_gini_gain: 0.0                        # a feature is verified above this gain on the screen
  run_dir: outputs/agent
  llm:
    backend: safechain                      # llm.timeout_s / stall_retry_s: 180s, 40s by default
    model: gpt-5
  models: [gpt-5, gpt-4.1]                  # offered per run in the UI

data_quality:
  enabled: true
  drop_failed: false    # report only while gates are open
  max_missing_rate: 0.99
  min_unique: 2
  max_psi: 0.25             # distribution shift a feature may not exceed
  distribution_check: true  # compare each variable's distribution across the splits
  distribution_reference: train
  distribution_bins: 10

feature_selection:
  enabled: true
  sample_size: 200000
  on_split: train
  chunk_size: 25
  ranking: spearman
  spearman:
    enabled: true
    target_min_abs: 0.01
    redundancy_max_abs: 0.80
  mutual_info:
    enabled: true
    bins: 20
    redundancy_max: 0.80
    redundancy_stat: max

model:
  task: binary
  num_boost_round: 2906
  early_stopping_rounds: 50
  threads_per_model: 4
  variants: [base, base_plus_new, leave_one_in]
  tuning:
    enabled: false
    mode: shared # shared | per_variant
    tune_on: base_plus_new
    n_trials: 20
  params:
    eta: 0.03
    max_depth: 12
    min_child_weight: 1050
    subsample: 0.8
    colsample_bytree: 1.0  
    max_bin: 256
    eval_metric: auc
    tree_method: hist

analysis:
  metrics_on: [train, valid, test]
  capture_rate_percents: [0.01, 0.05, 0.10]
  comparison_capture_percents: [0.01, 0.05, 0.10]
  baseline_variant: base
  shap:
    enabled: true
    sample_size: 10000
    on_split: test
    chunk_size: 2000

verdict:
  enabled: true
  gini_split: test
  min_gini_gain: 0.005
  # Off: valid is machinery, not evidence. The discovery screen scores
  # proposals on valid rows, so a discovered feature was selected for a valid
  # gain - requiring one asks it to repeat what it was picked for. Test is the
  # hold-out and the only evidence. Set true for a run with discovery disabled,
  # where valid is an independent second look at a hand-declared batch.
  require_valid_too: false
  max_shap_rank_pct: 0.5
