# cdss_us_sbs - internal use case, run in the private environment; kept here as
# the template for a dataset that arrives already split upstream.
#
#   1. open data/cdss_us_sbs/prepare.ipynb, point it at the three extracts, and
#      use its profile to fill in the TODOs below (target, id_cols, candidates)
#   2. run it to the end -> the three tables, column descriptions, few-shot rows
#   3. autofe -c configs/cdss_us_sbs.yaml
#      (add --set discovery.enabled=true once discovery.task_description is written)

run:
  name: cdss_us_sbs
  output_dir: outputs
  seed: 42
  n_jobs: -1
  backend: loky
  log_level: INFO
  gates: open           # measure everything, remove nothing, while we learn the data

data:
  paths:                # prepare.ipynb writes these; the pipeline reads them as given
    train: data/cdss_us_sbs/train.csv
    valid: data/cdss_us_sbs/valid.csv
    test:  data/cdss_us_sbs/test.csv
  target: TODO_target_column
  id_cols: []           # e.g. [acct_id, as_of_date] - enables the leakage check
  missing_values: [-9999]
  missing_indicators:       # add a 0/1 column recording where a feature was missing
    enabled: false          # enable when missingness itself may carry signal
    scope: candidates       # candidates | all
    min_missing_rate: 0.01  # skip columns barely ever missing
    suffix: _is_missing
    treat_as: new           # new | source - which feature list the indicators join
  weight_col: null

features:
  base: []              # empty = every other numeric column
  new: []               # list the candidates, or use new_prefix
  new_prefix: null
  exclude: []           # non-numeric columns the pipeline should ignore

# ---------------------------------------------------------------------------
# Feature discovery. Off until the task description is written: it is the
# proposer's only briefing on what the data is.
# ---------------------------------------------------------------------------
discovery:
  enabled: false
  strategy: caafe          # caafe | elfgym | ferg | featllm | promptfe
  task_description: ""     # TODO: what a row is, the population, what the target means
  # Domain background, fed to the proposer as its own block ahead of the columns:
  # what the SBS book is, what the CDSS score means, which quantities must not be
  # mixed. Kept in a file rather than here because it is a page long and belongs
  # to the private environment - the path is gitignored.
  task_context_path: data/cdss_us_sbs/task_context.md
  batch_size: 5
  max_rounds: 2
  screen_data: files       # splits | files - files: the samples prepare.ipynb draws
  screen_paths:            # the screen fits on train's sample, scores on valid's
    train: data/cdss_us_sbs/screen_train.csv
    valid: data/cdss_us_sbs/screen_valid.csv
  screen_boost_rounds: 150
  metric: adj_gini
  continuous_columns: null # TODO: the real measurements (or list categorical_columns)
  column_descriptions_path: data/cdss_us_sbs/column_descriptions.json   # prepare.ipynb
  few_shot_path: data/cdss_us_sbs/few_shot.csv                          # prepare.ipynb
  history_path: outputs/discovery_history/cdss_us_sbs.csv   # every proposal + verdict, fed back
  llm:
    backend: openai        # openai | safechain
    model: gpt-4o
    reasoning_effort: null

data_quality:
  enabled: true
  drop_failed: false    # report only while gates are open
  max_missing_rate: 0.99
  min_unique: 2
  max_psi: 0.25             # distribution shift a feature may not exceed
  distribution_check: true  # compare each variable's distribution across the splits
  distribution_reference: train
  distribution_bins: 10

feature_selection:
  enabled: true
  sample_size: 200000
  on_split: train
  chunk_size: 25
  ranking: spearman
  spearman:
    enabled: true
    target_min_abs: 0.01
    redundancy_max_abs: 0.90
  mutual_info:
    enabled: true
    bins: 20
    redundancy_max: 0.80
    redundancy_stat: max

model:
  task: binary
  num_boost_round: 500
  early_stopping_rounds: 50
  variants: [base, base_plus_new, leave_one_in]
  tuning:
    enabled: false
    mode: shared
    tune_on: base_plus_new
    n_trials: 20
  params:
    eta: 0.05
    max_depth: 5
    min_child_weight: 10
    subsample: 0.8
    colsample_bytree: 1.0   # keep at 1.0: with it below 1 the column COUNT moves
                            # the score, so base and leave_one_in differ by an
                            # offset that has nothing to do with the feature
    eval_metric: auc

analysis:
  metrics_on: [train, valid, test]
  capture_rate_percents: [0.01, 0.05, 0.10]
  comparison_capture_percents: [0.05]
  baseline_variant: base
  shap:
    enabled: true
    sample_size: 20000
    on_split: test

verdict:
  enabled: true
  gini_split: test
  min_gini_gain: 0.005
  # Off: valid is machinery, not evidence. The discovery screen scores
  # proposals on valid rows, so a discovered feature was selected for a valid
  # gain - requiring one asks it to repeat what it was picked for. Test is the
  # hold-out and the only evidence. Set true for a run with discovery disabled,
  # where valid is an independent second look at a hand-declared batch.
  require_valid_too: false
  max_shap_rank_pct: 0.5
