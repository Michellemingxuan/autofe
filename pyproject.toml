[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofe"
version = "0.1.0"
description = "Modular pipeline to verify the incremental value of newly proposed features"
requires-python = ">=3.9"
dependencies = [
    # Tested on both numpy generations: 1.26.4 and 2.0.0, full suite green on each.
    # No upper bound on purpose - the constraint that bites in locked environments
    # is a *compiled* dependency built against the other generation, not numpy itself.
    "numpy>=1.24",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost==1.7.6",
    "shap",
    "joblib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pyarrow"]
# Only the discovery package needs an LLM client; the validation stages do not,
# so these stay out of the core install.
discovery = ["openai", "python-dotenv", "nest_asyncio"]

[project.scripts]
autofe = "validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
