<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 Z" fill="#8A8275"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 Z" fill="#7A5AA8"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#FAF9F5"/>

  <!-- ===== HEADER ===== -->
  <text x="30" y="38" font-size="20" font-weight="700" fill="#2D2D2D" letter-spacing="-0.3">Fixed loop vs. agent</text>
  <line x1="30" y1="54" x2="1150" y2="54" stroke="#E5E0D2"/>
  <rect x="30" y="64" width="1120" height="26" rx="13" fill="#F4F0E6" stroke="#D4C5A9"/>
  <text x="590" y="81" font-size="10" fill="#5C5044" text-anchor="middle"><tspan font-weight="700">Same direction for both: </tspan>"Use the balance trajectory to find early cash-flow stress." The monthly balances are in an extra source, <tspan font-family="ui-monospace, Menlo, monospace">balances</tspan>.</text>

  <!-- ============================================================ -->
  <!-- LEFT: the fixed loop                                         -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="30" y="104" width="540" height="48" rx="8" fill="#FFFFFF" stroke="#D4C5A9" stroke-width="0.8"/>
    <path d="M30,112 a8,8 0 0 1 8,-8 h524 a8,8 0 0 1 8,8 v14 h-540 z" fill="#8A8275"/>
    <text x="300" y="121" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Previous workflow · fixed loop (CAAFE and the other strategies)</text>
    <text x="300" y="143" font-size="9.5" fill="#5C5044" text-anchor="middle" font-style="italic">The program decides the next step. The LLM only writes code.</text>
  </g>
  <text x="560" y="168" font-size="8" fill="#9A9387" text-anchor="end" font-style="italic">illustration</text>

  <!-- round 1 -->
  <text x="50" y="176" font-size="9" font-weight="700" fill="#A89B7C" letter-spacing="1.5">ROUND 1</text>
  <g filter="url(#shadow)">
    <rect x="50" y="184" width="500" height="40" rx="7" fill="#FFFFFF" stroke="#D4C5A9"/>
    <text x="64" y="200" font-size="9.5" font-weight="700" fill="#5C5044">Program builds the prompt</text>
    <text x="64" y="215" font-size="8.5" fill="#7A7569">task · column descriptions · example rows · history (empty). Only the model's columns.</text>
  </g>
  <line x1="300" y1="224" x2="300" y2="238" stroke="#8A8275" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="240" width="500" height="40" rx="7" fill="#EDE9F3" stroke="#C3B6D8"/>
    <text x="64" y="256" font-size="9.5" font-weight="700" fill="#4A3B69">LLM · one call</text>
    <text x="64" y="271" font-size="8.5" fill="#5C4B7A">writes a batch of 4 code blocks at once - ratios of model columns. It cannot look at any data.</text>
  </g>
  <line x1="300" y1="280" x2="300" y2="294" stroke="#8A8275" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="296" width="500" height="58" rx="7" fill="#FFFFFF" stroke="#D4C5A9"/>
    <text x="64" y="312" font-size="9.5" font-weight="700" fill="#5C5044">Program screens every block</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="8" text-anchor="middle">
      <rect x="64" y="322" width="112" height="20" rx="10" fill="#FFFFFF" stroke="#D4C5A9"/><text x="120" y="335" fill="#5C5044">util_x_tenure +0.004</text>
      <rect x="182" y="322" width="114" height="20" rx="10" fill="#FFFFFF" stroke="#D4C5A9"/><text x="239" y="335" fill="#5C5044">income_to_limit −0.001</text>
      <rect x="302" y="322" width="106" height="20" rx="10" fill="#FFFFFF" stroke="#D4C5A9"/><text x="355" y="335" fill="#5C5044">delinq_ratio +0.002</text>
      <rect x="414" y="322" width="124" height="20" rx="10" fill="#F7E4E3" stroke="#C85250"/><text x="476" y="335" fill="#8A332F">bal_per_acct ✗ inf (÷0)</text>
    </g>
  </g>
  <line x1="300" y1="354" x2="300" y2="382" stroke="#8A8275" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <text x="310" y="372" font-size="8.5" fill="#7A7569" font-style="italic">the error waits for the next round</text>

  <!-- round 2 -->
  <text x="50" y="392" font-size="9" font-weight="700" fill="#A89B7C" letter-spacing="1.5">ROUND 2</text>
  <g filter="url(#shadow)">
    <rect x="50" y="400" width="500" height="40" rx="7" fill="#FFFFFF" stroke="#D4C5A9"/>
    <text x="64" y="416" font-size="9.5" font-weight="700" fill="#5C5044">Program builds the prompt again, with the history</text>
    <text x="64" y="431" font-size="8.5" fill="#7A7569">"This block was rejected: inf … Fix or avoid this problem." - the error text only, no data.</text>
  </g>
  <line x1="300" y1="440" x2="300" y2="454" stroke="#8A8275" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="456" width="500" height="40" rx="7" fill="#EDE9F3" stroke="#C3B6D8"/>
    <text x="64" y="472" font-size="9.5" font-weight="700" fill="#4A3B69">LLM · one call</text>
    <text x="64" y="487" font-size="8.5" fill="#5C4B7A">a new batch of 4 - it may fix bal_per_acct among the new ideas, or drop it. It guesses the cause.</text>
  </g>
  <line x1="300" y1="496" x2="300" y2="510" stroke="#8A8275" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="512" width="500" height="40" rx="7" fill="#FFFFFF" stroke="#D4C5A9"/>
    <text x="64" y="528" font-size="9.5" font-weight="700" fill="#5C5044">Program screens the batch → max_rounds reached → stop</text>
    <text x="64" y="543" font-size="8.5" fill="#7A7569">The program stops the run by count, not because the direction is done.</text>
  </g>
  <rect x="50" y="562" width="500" height="26" rx="13" fill="#F7E4E3" stroke="#E4B5B3"/>
  <text x="300" y="579" font-size="9" fill="#8A332F" text-anchor="middle">balances is never used: it is not a model column, and the LLM cannot look for it.</text>

  <!-- ============================================================ -->
  <!-- RIGHT: the agent                                             -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="610" y="104" width="540" height="48" rx="8" fill="#FFFFFF" stroke="#C3B6D8" stroke-width="0.8"/>
    <path d="M610,112 a8,8 0 0 1 8,-8 h524 a8,8 0 0 1 8,8 v14 h-540 z" fill="#7A5AA8"/>
    <text x="880" y="121" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agentic workflow · Model Agent</text>
    <text x="880" y="143" font-size="9.5" fill="#4A3B69" text-anchor="middle" font-style="italic">The LLM decides the next step after it reads each result. The Session keeps the rules.</text>
  </g>
  <text x="1140" y="168" font-size="8" fill="#9A9387" text-anchor="end" font-style="italic">real run 20261003_225018_2585</text>

  <!-- the loop the LLM runs -->
  <path d="M624,186 V556" stroke="#C3B6D8" stroke-width="2"/>
  <text x="617" y="371" font-size="8.5" fill="#7A5AA8" text-anchor="middle" font-style="italic" transform="rotate(-90 617 371)">one LLM call per step · reads the result · picks the next tool</text>

  <g font-size="8.5">
    <!-- 1 -->
    <g filter="url(#shadow)">
      <rect x="636" y="176" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="196" r="9" fill="#7A5AA8"/><text x="652" y="199.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <rect x="668" y="183" width="96" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="716" y="194.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">catalog("balance")</text>
      <text x="772" y="194.5" fill="#3F7D5A">✓ finds the source balances</text>
      <text x="668" y="210" fill="#7A7569" font-style="italic">"There is a source called balances … I'll inspect it."</text>
    </g>
    <!-- 2 -->
    <g filter="url(#shadow)">
      <rect x="636" y="224" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="244" r="9" fill="#7A5AA8"/><text x="652" y="247.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <rect x="668" y="231" width="124" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="730" y="242.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">sample_rows("balances")</text>
      <text x="800" y="242.5" fill="#3F7D5A">✓ one balance per customer per month</text>
      <text x="668" y="258" fill="#7A7569" font-style="italic">"Next, I'll propose the point-in-time linkage."</text>
    </g>
    <!-- 3 -->
    <g filter="url(#shadow)">
      <rect x="636" y="272" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#E4B5B3"/>
      <circle cx="652" cy="292" r="9" fill="#C85250"/><text x="652" y="295.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <rect x="668" y="279" width="92" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="714" y="290.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">propose_linkage</text>
      <text x="768" y="290.5" fill="#8A332F">✗ error: no customer_id in the model ids</text>
      <text x="668" y="306" fill="#7A7569" font-style="italic">"The ids need to be parsed to get customer_id. I'll look at the ids."</text>
    </g>
    <!-- 4 -->
    <g filter="url(#shadow)">
      <rect x="636" y="320" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="340" r="9" fill="#7A5AA8"/><text x="652" y="343.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <rect x="668" y="327" width="146" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="741" y="338.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">sample_rows(model ids)</text>
      <text x="822" y="338.5" fill="#3F7D5A">✓ id = 105131_20240301_B</text>
      <text x="668" y="354" fill="#7A7569" font-style="italic">"customer_id is the part before the first underscore."</text>
    </g>
    <!-- 5 -->
    <g filter="url(#shadow)">
      <rect x="636" y="368" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#E4B5B3"/>
      <circle cx="652" cy="388" r="9" fill="#C85250"/><text x="652" y="391.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
      <rect x="668" y="375" width="92" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="714" y="386.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">propose_linkage</text>
      <text x="768" y="386.5" fill="#8A332F">✗ error: the merge fails</text>
      <text x="668" y="402" fill="#7A7569" font-style="italic">"Number in one table, text in the other?" It tries a probe, then makes both keys text.</text>
    </g>
    <!-- 6 -->
    <g filter="url(#shadow)">
      <rect x="636" y="416" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="436" r="9" fill="#7A5AA8"/><text x="652" y="439.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
      <rect x="668" y="423" width="92" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="714" y="434.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">propose_linkage</text>
      <text x="768" y="434.5" fill="#3F7D5A">✓ 0 point-in-time violations</text>
      <rect x="912" y="423" width="80" height="16" rx="8" fill="#DCE7F4" stroke="#3D6BA8"/><text x="952" y="434.5" fill="#1F3A5F" text-anchor="middle">👤 approved</text>
      <text x="668" y="450" fill="#7A7569" font-style="italic">The fix came in the next step. A linkage try spends no intent.</text>
    </g>
    <!-- 7 -->
    <g filter="url(#shadow)">
      <rect x="636" y="464" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="484" r="9" fill="#7A5AA8"/><text x="652" y="487.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
      <rect x="668" y="471" width="104" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="720" y="482.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">screen_feature ×3</text>
      <text x="780" y="482.5" fill="#3F7D5A">✓ all three verified, one intent each</text>
      <text x="668" y="498" fill="#5C5044">3-month trend +0.0015 · 6-month volatility +0.0176 · largest monthly jump +0.0026</text>
    </g>
    <!-- 8 -->
    <g filter="url(#shadow)">
      <rect x="636" y="512" width="504" height="40" rx="7" fill="#FFFFFF" stroke="#C3B6D8"/>
      <circle cx="652" cy="532" r="9" fill="#7A5AA8"/><text x="652" y="535.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
      <rect x="668" y="519" width="92" height="16" rx="8" fill="#FFFFFF" stroke="#7A5AA8"/><text x="714" y="530.5" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#4A3B69" text-anchor="middle">report_findings</text>
      <text x="768" y="530.5" fill="#5C5044">the agent stops: the direction is covered</text>
      <text x="668" y="546" fill="#7A7569" font-style="italic">Summary: what each feature measures and why it works; no data is missing.</text>
    </g>
  </g>
  <rect x="636" y="562" width="504" height="26" rx="13" fill="#E7F0EA" stroke="#B9D3C2"/>
  <text x="888" y="579" font-size="9" fill="#2C5B41" text-anchor="middle">balances found, joined point-in-time and used: 3 verified features the fixed loop cannot build.</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: the difference                                       -->
  <!-- ============================================================ -->
  <line x1="30" y1="606" x2="1150" y2="606" stroke="#E5E0D2"/>
  <g font-size="9">
    <text x="30" y="628" font-weight="700" fill="#A89B7C" letter-spacing="1">WHO DECIDES</text>
    <text x="300" y="628" fill="#5C5044" text-anchor="middle">a for-loop: rounds, then stop at max_rounds</text>
    <text x="880" y="628" fill="#4A3B69" text-anchor="middle">the LLM, step by step, inside the Session's rules</text>
    <text x="30" y="650" font-weight="700" fill="#A89B7C" letter-spacing="1">LLM CALL</text>
    <text x="300" y="650" fill="#5C5044" text-anchor="middle">once per round, returns a batch of code</text>
    <text x="880" y="650" fill="#4A3B69" text-anchor="middle">once per step, picks one tool</text>
    <text x="30" y="672" font-weight="700" fill="#A89B7C" letter-spacing="1">DATA</text>
    <text x="300" y="672" fill="#5C5044" text-anchor="middle">what the prompt shows: model columns</text>
    <text x="880" y="672" fill="#4A3B69" text-anchor="middle">looks, joins extra sources, asks for new data</text>
    <text x="30" y="694" font-weight="700" fill="#A89B7C" letter-spacing="1">AN ERROR</text>
    <text x="300" y="694" fill="#5C5044" text-anchor="middle">text in the next round's prompt, fixed or dropped later</text>
    <text x="880" y="694" fill="#4A3B69" text-anchor="middle">read at once; the agent looks at the data, then fixes it</text>
  </g>
  <line x1="590" y1="616" x2="590" y2="702" stroke="#E5E0D2"/>
</svg>
