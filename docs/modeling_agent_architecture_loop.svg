  <text x="854" y="500" font-size="14" fill="#6E6E73">retrain on full data, test on</text>
  <text x="854" y="521" font-size="14" fill="#6E6E73">data the agent never sees</text>
  <g filter="url(#soft)"><rect x="1180" y="410" width="250" height="136" rx="26" fill="#FFFFFF"/></g>
  <circle cx="1220" cy="452" r="18" fill="#7A5AA8"/>
  <text x="1220" y="458" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1250" y="461" font-size="26" font-weight="700" fill="#1D1D1F" letter-spacing="-0.5">Infer</text>
  <text x="1204" y="500" font-size="14" fill="#6E6E73">re-score the target cases:</text>
  <text x="1204" y="521" font-size="14" fill="#6E6E73">does the risk show sooner?</text>

