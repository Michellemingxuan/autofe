  <rect width="1920" height="1090" fill="#FAF9F5"/>

  <!-- ===== HEADER ===== -->
  <text x="90" y="96" font-size="44" font-weight="700" fill="#1D1D1F" letter-spacing="-1.2">Modeling Agent · four loops</text>
  <text x="90" y="134" font-size="17" fill="#6E6E73">From every idea to every review, each loop feeds what it learns back in — fast loops inside, slow loops outside.</text>

  <!-- ===== KNOWLEDGE BASE ===== -->
