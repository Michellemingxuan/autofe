  <circle cx="1110" cy="766" r="5" fill="#3F7D5A"/><circle cx="1126" cy="766" r="5" fill="#3F7D5A"/><circle cx="1142" cy="766" r="5" fill="#3F7D5A"/><circle cx="1158" cy="766" r="5" fill="#B5523B"/><circle cx="1174" cy="766" r="5" fill="#E0DACD"/><circle cx="1190" cy="766" r="5" fill="#E0DACD"/>
  <circle cx="1110" cy="784" r="5" fill="#3F7D5A"/><circle cx="1126" cy="784" r="5" fill="#3F7D5A"/><circle cx="1142" cy="784" r="5" fill="#3F7D5A"/><circle cx="1158" cy="784" r="5" fill="#3F7D5A"/><circle cx="1174" cy="784" r="5" fill="#3F7D5A"/><circle cx="1190" cy="784" r="5" fill="#3F7D5A"/>
  <text x="1150" y="806" font-size="11" fill="#9A9387" text-anchor="middle">checks per feature</text>

