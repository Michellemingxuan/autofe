  <circle cx="530" cy="452" r="18" fill="#7A5AA8"/>
  <text x="530" y="458" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="560" y="461" font-size="26" font-weight="700" fill="#1D1D1F" letter-spacing="-0.5">Discover</text>
  <text x="514" y="500" font-size="14" fill="#6E6E73">ideas → code → quick checks</text>
  <text x="514" y="521" font-size="14" fill="#6E6E73">asks for new data when needed</text>
  <g filter="url(#soft)"><rect x="830" y="410" width="270" height="136" rx="26" fill="#FFFFFF"/></g>
  <circle cx="870" cy="452" r="18" fill="#7A5AA8"/>
