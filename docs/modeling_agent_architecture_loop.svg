<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1090"
     font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', ui-sans-serif, 'Segoe UI', system-ui, Helvetica, sans-serif">
  <defs>
