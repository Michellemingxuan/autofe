  <rect x="212" y="1018" width="26" height="20" rx="6" fill="#7A5AA8"/><text x="225" y="1032.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><text x="248" y="1034" font-size="15" font-weight="700" fill="#1D1D1F">Idea loop<tspan font-weight="400" fill="#6E6E73"> · every idea</tspan></text><text x="248" y="1055" font-size="12.5" fill="#6E6E73">each idea's checks re-rank the ideas</text>
